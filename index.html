<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkNest</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="app-icon.png">
<meta name="theme-color" content="#1b1f3b">
<!-- The ?v= version makes browsers fetch the new file after an update instead of
     reusing an old cached copy. Change it whenever any of the files changes. -->
<link rel="stylesheet" href="styles.css?v=2026-10-12.49">
<script src="firebase-config.js?v=2026-10-12.49"></script>
<script>
  // With Firebase set up, show nothing of the app until collab.js knows which page to show
  if (window.GANTT_FIREBASE) document.documentElement.classList.add('cloud', 'page-loading');
</script>
</head>
<body>
<!-- Start page: signed out (filled by collab.js). Also where you land after signing out. -->
<section id="startPage" class="start" aria-label="Welcome">
  <div class="start-inner">
    <svg class="start-logo" viewBox="119 170 786 683" aria-hidden="true"><rect x="119" y="170" width="547" height="171" rx="85.5" fill="#ff6b4a"/><circle cx="818.5" cy="255.5" r="85.5" fill="#ff6b4a"/><circle cx="204.5" cy="511.5" r="85.5" fill="#ffc145"/><rect x="358" y="426" width="547" height="171" rx="85.5" fill="#ffc145"/><rect x="119" y="682" width="547" height="171" rx="85.5" fill="#b8b5ff"/><circle cx="818.5" cy="767.5" r="85.5" fill="#b8b5ff"/></svg>
    <h1>WorkNest</h1>
    <p class="start-tagline">Plan your projects and talk them through with your customers.</p>
    <div class="start-card" id="startCard"></div>
  </div>
  <p class="start-foot">Free · Works on your computer and your phone</p>
</section>

<!-- Your projects: signed in, no project open (filled by collab.js) -->
<section id="projectsPage" class="home" aria-label="Your projects">
  <header class="home-bar">
    <a class="brand" href="./"><svg class="brand-logo" viewBox="119 170 786 683" aria-hidden="true"><rect x="119" y="170" width="547" height="171" rx="85.5" fill="#ff6b4a"/><circle cx="818.5" cy="255.5" r="85.5" fill="#ff6b4a"/><circle cx="204.5" cy="511.5" r="85.5" fill="#ffc145"/><rect x="358" y="426" width="547" height="171" rx="85.5" fill="#ffc145"/><rect x="119" y="682" width="547" height="171" rx="85.5" fill="#b8b5ff"/><circle cx="818.5" cy="767.5" r="85.5" fill="#b8b5ff"/></svg><span>WorkNest</span></a>
    <label class="home-search"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 20l-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><input id="projectSearch" type="search" placeholder="Search projects" aria-label="Search projects" autocomplete="off"></label>
    <span class="spacer"></span>
  </header>
  <div class="home-body">
    <div class="home-main" id="homeMain"></div>
  </div>
  <!-- A project's ⋮ menu (filled by collab.js) -->
  <div class="menu tile-menu" id="tileMenu" role="menu" hidden></div>
</section>

<main>
  <!-- The top bar: WorkNest's logo (back to all projects) and your account -->
  <div class="app-head">
    <a class="home-link" href="./" title="All projects" aria-label="All projects"><svg class="home-logo" viewBox="119 170 786 683" aria-hidden="true"><rect x="119" y="170" width="547" height="171" rx="85.5" fill="#ff6b4a"/><circle cx="818.5" cy="255.5" r="85.5" fill="#ff6b4a"/><circle cx="204.5" cy="511.5" r="85.5" fill="#ffc145"/><rect x="358" y="426" width="547" height="171" rx="85.5" fill="#ffc145"/><rect x="119" y="682" width="547" height="171" rx="85.5" fill="#b8b5ff"/><circle cx="818.5" cy="767.5" r="85.5" fill="#b8b5ff"/></svg><span class="home-brand">WorkNest</span></a>
    <span class="spacer"></span>
  </div>


  <section class="chart-panel">
    <!-- The project's name (click to rename; it heads saved images), the dot with
         its colour on All projects (click to choose one), and where it's kept -->
    <div class="project-title">
      <h1 id="projectName" contenteditable="plaintext-only" spellcheck="false" title="Click to rename the project"></h1>
      <div class="menu-wrap project-dot-wrap">
        <button type="button" id="colorBtn" class="project-dot" aria-haspopup="dialog" aria-expanded="false" aria-controls="colorPop"></button>
        <div class="menu color-pop" id="colorPop" role="dialog" aria-label="The project's colour" hidden>
          <p class="color-pop-head">Colour on All projects</p>
          <div class="color-swatches"><button type="button" data-color="#ff6b4a" style="--c:#ff6b4a" aria-label="#ff6b4a" title="#ff6b4a"></button><button type="button" data-color="#ffc145" style="--c:#ffc145" aria-label="#ffc145" title="#ffc145"></button><button type="button" data-color="#b8b5ff" style="--c:#b8b5ff" aria-label="#b8b5ff" title="#b8b5ff"></button><button type="button" data-color="#3fb6a8" style="--c:#3fb6a8" aria-label="#3fb6a8" title="#3fb6a8"></button><button type="button" data-color="#4f8ff7" style="--c:#4f8ff7" aria-label="#4f8ff7" title="#4f8ff7"></button><button type="button" data-color="#f06fa8" style="--c:#f06fa8" aria-label="#f06fa8" title="#f06fa8"></button><button type="button" data-color="#6cc070" style="--c:#6cc070" aria-label="#6cc070" title="#6cc070"></button><button type="button" data-color="#8a8fa8" style="--c:#8a8fa8" aria-label="#8a8fa8" title="#8a8fa8"></button></div>
          <div class="color-custom">
            <input type="color" id="colorNative" title="Pick any colour" aria-label="Pick any colour">
            <input id="colorHex" maxlength="7" spellcheck="false" autocomplete="off" placeholder="#4f8ff7" aria-label="Colour as a hex code" title="A hex code, like #4f8ff7">
          </div>
          <div class="error" id="colorError"></div>
          <button type="button" id="colorReset" class="link-like">Use the label's colour</button>
        </div>
      </div>
      <span id="placeBadge" class="place-badge" hidden title="Saved in this browser only: not on your other devices, can't be shared, and lost if the browser's data is cleared"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 20h8M12 16v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> On this computer only</span>
      <!-- Someone else's project: whose it is, and that you can only view it (and comment) -->
      <span id="viewOnlyBadge" class="place-badge view-badge" hidden title="You can see the plan and write comments, but not change it"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg><span class="view-who"></span>View only</span>
    </div>
    <div class="toolbar">
      <!-- On the left: Today and Overview. To show a quarter, month, week or day, click it in
           the chart's date header; ‹ › at the header's ends step back / forward
           (pinching zooms freely). On the right: undo / redo, Save, Export /
           Import and + New task. -->
      <button id="todayBtn" title="Go to today">Today</button>
      <button id="overviewBtn" class="overview-btn" aria-pressed="false" title="Fit the whole project in view (click again to go back)">Overview</button>
      <span class="spacer"></span>
      <!-- Undo / Redo, and Save (changes are a draft until saved) -->
      <div class="seg history" role="group" aria-label="Undo and redo">
        <button id="undoBtn" class="icon-btn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 14L4 9l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button id="redoBtn" class="icon-btn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 14l5-5-5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H10a6 6 0 0 0 0 12h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <button id="saveBtn" class="save-btn" title="Save your changes (Ctrl+S)">Save</button>
      <!-- Saving and loading, as one joined group: an Export menu and Import -->
      <div class="seg" role="group" aria-label="Save and load">
        <div class="menu-wrap">
          <button id="exportMenuBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="exportMenu">Export ▾</button>
          <div class="menu" id="exportMenu" role="menu" hidden>
            <!-- Share… (or Move online… for a project on this computer): only for its owner (collab.js) -->
            <div id="shareItem" hidden>
              <button role="menuitem" id="shareBtn" title="Share this project with a customer">Share…</button><hr></div>
            <button role="menuitem" id="imageBtn" title="A picture of the whole chart">Image (.png)</button>
            <button role="menuitem" id="calendarBtn" title="For Google Calendar, Outlook or Apple Calendar">Calendar (.ics)</button>
            <button role="menuitem" id="exportBtn" title="The whole project, to import again later">JSON</button>
          </div>
        </div>
        <button id="importBtn" title="Load a project from an exported JSON file">Import JSON</button>
      </div>
      <button id="newTaskBtn" class="primary" title="Add a task (or drag across empty days in the chart)">+ New task</button>
      <!-- Sharing online (only with Firebase set up, see collab.js) -->
      <div class="menu-wrap" id="accountWrap" hidden>
        <button id="accountBtn" class="avatar" aria-haspopup="menu" aria-expanded="false" aria-controls="accountMenu"></button>
        <div class="menu acct-menu" id="accountMenu" role="menu" hidden></div>
      </div>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
    <!-- The chart, with ‹ and › at the two ends of its date header (a period back / forward) -->
    <div class="chart-wrap">
      <div id="chart"></div>
      <button id="prevBtn" class="edge-nav prev" title="Previous" aria-label="Previous">‹</button>
      <button id="nextBtn" class="edge-nav next" title="Next" aria-label="Next">›</button>
    </div>
    <!-- Phones: the chart turned a quarter, time running down (filled by app.js) -->
    <p class="turned-hint">Press and hold an empty spot, then drag, to add a task. Tap a task to open it.</p>
    <div id="turned"></div>
  </section>
</main>

<dialog id="shiftDialog">
  <form method="dialog">
    <h2 id="shiftTitle"></h2>
    <p id="shiftText"></p>
    <div class="list" id="shiftList"></div>
    <!-- "Apply" comes first so Enter picks it; the row is shown reversed -->
    <div class="actions reverse">
      <button value="apply" class="primary">Apply</button>
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<!-- Group names suggested when typing a task's group -->
<datalist id="groupList"></datalist>

<!-- Everything about one task: a panel on a computer, slid up from the bottom on a phone (filled by app.js) -->
<dialog id="taskSheet" class="sheet" aria-label="Task"><div id="sheetBody" tabindex="-1"></div></dialog>

<dialog id="confirmDialog">
  <form method="dialog">
    <h2 id="confirmTitle"></h2>
    <p id="confirmText"></p>
    <div class="actions reverse">
      <button value="ok" class="primary" id="confirmOk">OK</button>
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="nameDialog">
  <form method="dialog">
    <h2>New task</h2>
    <p id="nameText"></p>
    <label class="field">Task name <input id="nameInput" autocomplete="off"></label>
    <!-- "Add task" comes first so Enter picks it; the row is shown reversed -->
    <div class="actions reverse">
      <button value="ok" class="primary">Add task</button>
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<!-- Links panel, opened from a task's or subtask's paperclip (filled by app.js) -->
<div id="linkPanel" class="link-panel" role="dialog" aria-labelledby="linkTitle" hidden>
  <div class="link-head"><h2 id="linkTitle">Links</h2><button id="linkClose" title="Close">✕</button></div>
  <ul id="linkList"></ul>
  <form id="linkForm">
    <input id="linkInput" type="text" inputmode="url" autocomplete="off" placeholder="Paste a link (Google Doc, website…)">
    <button class="primary">Add</button>
  </form>
  <div class="error" id="linkError"></div>
</div>

<!-- Signing in and sharing (filled by collab.js) -->
<dialog id="cloudDialog" class="cloud-dialog" aria-label="Sharing"><div id="cloudBody"></div></dialog>

<!-- A comment's image, larger -->
<dialog id="imageViewer" class="image-viewer" aria-label="Image"><img alt=""></dialog>

<!-- "Coming up": tasks starting today and later this week (filled by app.js) -->
<aside id="notice" class="notice" role="status" aria-live="polite" hidden></aside>

<!-- Filled with a copy of the whole chart just before saving an image -->
<div id="exportArea" class="export"></div>

<script src="app.js?v=2026-10-12.49"></script>
<script src="combined.js?v=2026-10-12.49"></script>
<script src="collab.js?v=2026-10-12.49"></script>
</body>
</html>
