<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Gantt</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <!-- The project name: click to rename. It heads saved images. -->
  <h1 id="projectName" contenteditable="plaintext-only" spellcheck="false" title="Click to rename the project"></h1>

  <section class="panel">
    <form id="taskForm">
      <label>Task <input name="name" required placeholder="e.g. Design mockups"></label>
      <label>Group <input name="group" list="groupList" placeholder="optional"></label>
      <datalist id="groupList"></datalist>
      <label>Start <input name="start" type="date" required></label>
      <label>End <input name="end" type="date" required></label>
      <label>Milestone ◆
        <select name="milestone">
          <option value="">None</option>
          <option value="start">At start</option>
          <option value="end">At end</option>
        </select>
      </label>
      <button class="primary" type="submit" id="submitBtn">Add task</button>
      <button type="button" id="cancelEdit" hidden>Cancel</button>
    </form>
    <div class="error" id="error"></div>
  </section>

  <section class="panel chart-panel">
    <div class="toolbar">
      <!-- What the chart shows, as one joined group. Day / Week / Month set the
           zoom to a preset (pinching zooms freely); Today and Overview move the view. -->
      <div class="seg" id="viewBtns" role="group" aria-label="View">
        <button data-view="day">Day</button>
        <button data-view="week">Week</button>
        <button data-view="month">Month</button>
        <button id="todayBtn" title="Scroll to today">Today</button>
        <button id="overviewBtn" title="Fit the whole project in view (click again to go back)">Overview</button>
      </div>
      <button id="collapseAllBtn" hidden>Collapse all</button>
      <span class="spacer"></span>
      <!-- Saving and loading, as one joined group -->
      <div class="seg" role="group" aria-label="Save and load">
        <button id="imageBtn" title="Download a picture (PNG) of the whole chart">Save image</button>
        <button id="exportBtn" title="Download the project as a file you can import later">Export JSON</button>
        <button id="importBtn" title="Load a project from an exported file">Import JSON</button>
      </div>
      <button id="clearBtn">Clear all</button>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
    <div id="chart"></div>
  </section>
</main>

<dialog id="shiftDialog">
  <form method="dialog">
    <h2 id="shiftTitle"></h2>
    <p id="shiftText"></p>
    <div class="list" id="shiftList"></div>
    <!-- "Apply" comes first so Enter picks it; the row is shown reversed -->
    <div class="actions reverse">
      <button value="apply" class="primary">Apply</button>
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="confirmDialog">
  <form method="dialog">
    <h2 id="confirmTitle"></h2>
    <p id="confirmText"></p>
    <div class="actions reverse">
      <button value="ok" class="primary" id="confirmOk">OK</button>
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="nameDialog">
  <form method="dialog">
    <h2>New task</h2>
    <p id="nameText"></p>
    <label class="field">Task name <input id="nameInput" autocomplete="off"></label>
    <!-- "Add task" comes first so Enter picks it; the row is shown reversed -->
    <div class="actions reverse">
      <button value="ok" class="primary">Add task</button>
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<!-- Filled with a copy of the whole chart just before saving an image -->
<div id="exportArea" class="export"></div>

<script src="app.js"></script>
</body>
</html>
