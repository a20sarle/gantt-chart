<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Gantt</title>
<!-- The ?v= version makes browsers fetch the new file after an update instead of
     reusing an old cached copy. Change it whenever styles.css or app.js changes. -->
<link rel="stylesheet" href="styles.css?v=2026-10-06.12">
</head>
<body>
<main>
  <!-- The project name: click to rename. It heads saved images. -->
  <h1 id="projectName" contenteditable="plaintext-only" spellcheck="false" title="Click to rename the project"></h1>

  <section class="panel form-panel">
    <!-- Only shown on phones, where the form is folded away -->
    <button type="button" id="newTaskBtn" class="primary new-task-btn">+ New task</button>
    <form id="taskForm">
      <label>Task <input name="name" required placeholder="e.g. Design mockups"></label>
      <label>Group <input name="group" list="groupList" placeholder="optional"></label>
      <datalist id="groupList"></datalist>
      <label>Start <input name="start" type="date" required></label>
      <label>End <input name="end" type="date" required></label>
      <label>Milestone ◆
        <select name="milestone">
          <option value="">None</option>
          <option value="start">At start</option>
          <option value="end">At end</option>
        </select>
      </label>
      <button class="primary" type="submit" id="submitBtn">Add task</button>
      <button type="button" id="cancelEdit" hidden>Cancel</button>
    </form>
    <div class="error" id="error"></div>
  </section>

  <section class="panel chart-panel">
    <div class="toolbar">
      <!-- What the chart shows, as one joined group. Day / Week / Month set the
           zoom to a preset (pinching zooms freely); Today and Overview move the view. -->
      <div class="seg" id="viewBtns" role="group" aria-label="View">
        <button data-view="day" title="Show one day">Day</button>
        <button data-view="week" title="Show one week (Monday to Sunday)">Week</button>
        <button data-view="month" title="Show one month">Month</button>
        <button data-view="quarter" title="Show one quarter">Quarter</button>
        <button id="prevBtn" title="Previous" aria-label="Previous">‹</button>
        <button id="todayBtn" title="Go to today">Today</button>
        <button id="nextBtn" title="Next" aria-label="Next">›</button>
        <button id="overviewBtn" title="Fit the whole project in view (click again to go back)">Overview</button>
      </div>
      <!-- Phones only: Schedule (a list by week) or the Gantt chart, and showing the task list -->
      <div class="seg phone-only" id="phoneViewBtns" role="group" aria-label="Phone view">
        <button data-phone="schedule">Schedule</button>
        <button data-phone="chart">Chart</button>
      </div>
      <button id="schedTodayBtn" class="phone-only" title="Go to this week">Today</button>
      <button id="collapseAllBtn" hidden>Collapse all</button>
      <span class="spacer"></span>
      <!-- Saving and loading, as one joined group: an Export menu and Import -->
      <div class="seg" role="group" aria-label="Save and load">
        <div class="menu-wrap">
          <button id="exportMenuBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="exportMenu">Export ▾</button>
          <div class="menu" id="exportMenu" role="menu" hidden>
            <button role="menuitem" id="imageBtn" title="A picture of the whole chart">Image (.png)</button>
            <button role="menuitem" id="calendarBtn" title="For Google Calendar, Outlook or Apple Calendar">Calendar (.ics)</button>
            <button role="menuitem" id="exportBtn" title="The whole project, to import again later">JSON</button>
          </div>
        </div>
        <button id="importBtn" title="Load a project from an exported JSON file">Import JSON</button>
      </div>
      <button id="clearBtn">Clear all</button>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
    <div id="chart"></div>
    <!-- Phones: tasks as a list by week, scrolled downwards (filled by app.js) -->
    <div id="schedule"></div>
    <!-- Phones: the chart turned a quarter, time running down (filled by app.js) -->
    <p class="turned-hint">Press and hold an empty spot, then drag, to add a task. Tap a task to open it.</p>
    <div id="turned"></div>
  </section>
</main>

<dialog id="shiftDialog">
  <form method="dialog">
    <h2 id="shiftTitle"></h2>
    <p id="shiftText"></p>
    <div class="list" id="shiftList"></div>
    <!-- "Apply" comes first so Enter picks it; the row is shown reversed -->
    <div class="actions reverse">
      <button value="apply" class="primary">Apply</button>
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<!-- Phones: everything about one task, slid up from the bottom (filled by app.js) -->
<dialog id="taskSheet" class="sheet" aria-label="Task"><div id="sheetBody"></div></dialog>

<dialog id="confirmDialog">
  <form method="dialog">
    <h2 id="confirmTitle"></h2>
    <p id="confirmText"></p>
    <div class="actions reverse">
      <button value="ok" class="primary" id="confirmOk">OK</button>
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="nameDialog">
  <form method="dialog">
    <h2>New task</h2>
    <p id="nameText"></p>
    <label class="field">Task name <input id="nameInput" autocomplete="off"></label>
    <!-- "Add task" comes first so Enter picks it; the row is shown reversed -->
    <div class="actions reverse">
      <button value="ok" class="primary">Add task</button>
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<!-- Links panel, opened from a task's or subtask's paperclip (filled by app.js) -->
<div id="linkPanel" class="link-panel" role="dialog" aria-labelledby="linkTitle" hidden>
  <div class="link-head"><h2 id="linkTitle">Links</h2><button id="linkClose" title="Close">✕</button></div>
  <ul id="linkList"></ul>
  <form id="linkForm">
    <input id="linkInput" type="text" inputmode="url" autocomplete="off" placeholder="Paste a link (Google Doc, website…)">
    <button class="primary">Add</button>
  </form>
  <div class="error" id="linkError"></div>
</div>

<!-- "Coming up": tasks starting today and later this week (filled by app.js) -->
<aside id="notice" class="notice" role="status" aria-live="polite" hidden></aside>

<!-- Filled with a copy of the whole chart just before saving an image -->
<div id="exportArea" class="export"></div>

<script src="app.js?v=2026-10-06.12"></script>
</body>
</html>
